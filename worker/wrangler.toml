name = "golem-craftworks"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The website itself. Everything in site/ is served as-is; the Worker code only runs for the paths below.
[assets]
directory = "../site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = [
  "/api/*", "/webhooks/*", "/admin/*",
  # Built from the catalog so search engines and AI crawlers see real content (worker/src/pages.ts).
  "/", "/product/*", "/shop/*", "/sitemap.xml", "/robots.txt", "/llms.txt", "/feeds/*",
  # These two show the shipping price, which is filled in from SHIPPING_FLAT_CENTS below.
  "/js/config.js", "/shipping/"
]

# Builds site/ts -> site/js before every deploy and `wrangler dev`.
[build]
command = "node ../node_modules/typescript/lib/tsc.js -p ../site"

# The domain must already be active in this Cloudflare account (README step 2).
# PRE-LAUNCH: the site lives at preview.golemcraftworks.com while the main domain still forwards
# from GoDaddy. To go live: delete the A records for golemcraftworks.com and www in Cloudflare DNS,
# swap the route below for the two commented ones, switch the three URLs in [vars] back,
# and set NOINDEX to "false" so search engines can list the site.
[[routes]]
pattern = "preview.golemcraftworks.com"
custom_domain = true

# [[routes]]
# pattern = "golemcraftworks.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.golemcraftworks.com"
# custom_domain = true

# Hourly safety check (minute 7 to stay off the top of the hour), then Etsy drafts for new dice
# sets half an hour later. The third is the daily report email, at 13:17 UTC (8:17am Central in summer,
# 7:17am in winter). The second and third are named in worker/src/index.ts (DRAFTS_CRON, REPORT_CRON):
# change them there too.
[triggers]
crons = ["7 * * * *", "37 * * * *", "17 13 * * *"]

# Create with:  npx wrangler kv namespace create GC_KV   then paste the id here.
[[kv_namespaces]]
binding = "GC_KV"
id = "68298024fb784e2ba7914b0c297a625b"

[vars]
# PRE-LAUNCH values. Live: SITE_URL = "https://golemcraftworks.com"
#   ALLOWED_ORIGINS = "https://golemcraftworks.com,https://www.golemcraftworks.com"
#   SQUARE_WEBHOOK_URL = "https://golemcraftworks.com/webhooks/square"
SITE_URL = "https://preview.golemcraftworks.com"
NOINDEX = "true"                     # keeps the preview address out of search results; "false" at launch
ALLOWED_ORIGINS = "https://preview.golemcraftworks.com"
SQUARE_ENV = "production"            # "sandbox" while testing
SQUARE_LOCATION_ID = "LNQ38H5968VDC"
SQUARE_WEBHOOK_URL = "https://preview.golemcraftworks.com/webhooks/square"   # must match the URL given to Square exactly
ETSY_KEYSTRING = "6ae72rteu6oiyw8qal74efaq"
ETSY_SHOP_ID = "52196219"
# The flat shipping price, in cents. This is the only place it's set: checkout, the cart,
# the shipping page and the product data for search engines all read it from here.
SHIPPING_FLAT_CENTS = "800"
# The sales count on the site is Etsy's figure plus items sold in Square from this date on.
# It's the day Etsy's own Square integration was disconnected: before then, Etsy's figure
# already included Square sales. Empty = show Etsy's figure alone.
SQUARE_SALES_SINCE = "2026-10-04"
# Optional: only list items in these Square categories online (comma-separated). Empty = everything.
ONLINE_CATEGORIES = ""
# Optional: never list items in these Square categories online (e.g. "Market only").
HIDDEN_CATEGORIES = "In-Person"
# Start with "true": the Worker logs what it WOULD change on Etsy/Square without changing anything.
SYNC_DRY_RUN = "false"
# New items in these Square categories get an Etsy draft made for them (comma-separated). Empty = never.
# Settings are copied from the Etsy draft whose title starts with "TEMPLATE".
ETSY_DRAFT_CATEGORIES = "8-piece RPG Dice"
# "true" publishes those drafts straight away (Etsy charges its listing fee). Leave "false" to review each one first.
ETSY_DRAFTS_AUTO_PUBLISH = "false"
# Commission form emails (sent through Resend). EMAIL_FROM must be on a domain verified in Resend.
EMAIL_FROM = "Golem Craftworks <commissions@golemcraftworks.com>"
COMMISSION_TO = "commissions@golemcraftworks.com"
# Where the "New website order" emails go. Empty = COMMISSION_TO.
SALES_TO = "sales@golemcraftworks.com"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   SQUARE_ACCESS_TOKEN
#   SQUARE_WEBHOOK_SIGNATURE_KEY
#   ETSY_SHARED_SECRET
#   ETSY_WEBHOOK_SECRET
#   ADMIN_TOKEN
#   RESEND_API_KEY
#   TURNSTILE_SECRET   (optional: spam check on the review form; pair with turnstileSiteKey in site/ts/config.ts)
